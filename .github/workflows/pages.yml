# Publishes the keyboard tester (index.html) with the keymap picture and the
# VIA definition to GitHub Pages.
name: Pages

on:
  push:
    branches: ["main"]
    paths:
      - index.html
      - images/**
      - clockworkpi/uconsole/via.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site
        run: |
          mkdir -p _site/images
          cp index.html _site/
          cp images/layout.svg _site/images/
          cp clockworkpi/uconsole/via.json _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
